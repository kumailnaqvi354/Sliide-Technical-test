root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  bin = "./tmp/api"
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  # Longer than the API's 8s shutdown timeout, so a restart lets in-flight
  # calls drain. An idle API exits at once, so reloads are no slower.
  kill_delay = "9s"
